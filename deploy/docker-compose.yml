# CatPital 生产部署：cd deploy && cp .env.example .env && 编辑 .env && docker compose up -d --build
# 对外只有 web 一个端口（默认 127.0.0.1:38080），postgres / redis / server 只在私有网络内。
name: catpital

x-build: &build
  context: ..
  dockerfile: deploy/Dockerfile

services:
  web:
    build:
      <<: *build
      target: web
      args:
        VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
    image: catpital-web:latest
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      # 默认只绑定本机回环：由宿主机反代（1Panel OpenResty）转发；要直接用 IP:端口访问就把 APP_BIND 改成 0.0.0.0
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-38080}:80"
    networks: [internal]

  server:
    build:
      <<: *build
      target: server
    image: catpital-server:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3001"
      DATABASE_URL: postgresql://catpital:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/catpital
      REDIS_URL: redis://redis:6379
      DEV_LOGIN: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    # 让容器能用 http://host.docker.internal:5000 访问跑在宿主机上的 Skylbot（货币兑换）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stop_grace_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: catpital
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: catpital
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catpital -d catpital"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # 可选：Cloudflare Tunnel —— 不开任何宿主机端口、不碰 80/443，直接获得 HTTPS 公网域名
  #   docker compose --profile tunnel up -d   （需要 .env 里的 CLOUDFLARE_TUNNEL_TOKEN；隧道服务地址填 http://web:80）
  tunnel:
    image: cloudflare/cloudflared:2025.8.1
    profiles: [tunnel]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [web]
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
