# 容器内 nginx：唯一对外入口（容器 80 → 宿主机 ${APP_PORT}）
#   /                     前端静态文件（SPA）
#   /api/*  /ws           → server:3001（Discord 代理剥掉 /.proxy 之后的路径）
#   /.proxy/*             普通浏览器直接访问时的路径，内部重写去掉 /.proxy
#   /discord-cdn/*        → cdn.discordapp.com（头像；Portal 里没映射 /discord-cdn 时的兜底）

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Docker 内置 DNS：server 容器重启换 IP 后也能重新解析
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $catpital_api http://server:3001;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 外层反代（1Panel / OpenResty）传来的真实 IP
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    rewrite ^/\.proxy(/.*)$ $1 last;

    location /api/ {
        proxy_pass $catpital_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /ws {
        proxy_pass $catpital_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 行情长连接：服务端有心跳，这里只是防止空闲时被 nginx 断开
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location = /health {
        proxy_pass $catpital_api;
    }

    location /discord-cdn/ {
        set $discord_cdn cdn.discordapp.com;
        rewrite ^/discord-cdn(/.*)$ $1 break;
        proxy_pass https://$discord_cdn;
        proxy_ssl_server_name on;
        proxy_set_header Host cdn.discordapp.com;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        expires 1d;
    }

    # 背景音乐：nginx 自带的 mime.types 没有 .opus（会被当成 application/octet-stream），这里补全音频类型。
    # 文件名不带哈希，只缓存一天；nginx 默认支持 Range 请求，拖动 / 循环播放不需要整首重下
    location /bgm/ {
        types {
            audio/ogg  opus ogg;
            audio/webm webm;
            audio/mp4  m4a;
            audio/mpeg mp3;
            audio/wav  wav;
        }
        expires 1d;
        try_files $uri =404;
    }

    # Vite 产物带哈希，可以长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
